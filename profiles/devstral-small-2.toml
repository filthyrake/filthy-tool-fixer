# Devstral Small 2 — 24B dense (Mistral), fast tier
# ~15GB, fits on A30. 384K native context. Apache 2.0.
# Purpose-built for agentic coding: tool calling, codebase exploration, multi-file editing.
# Fine-tuned from Mistral Small 3.1. Requires Ollama 0.13.3+.
# 68% SWE-Bench Verified — competes with models 5x its size.
# Tends to wander on open-ended search tasks without num_ctx cap (384K native is too much rope).

[model]
pattern = "devstral-small-2:*"
max_retries = 3
request_timeout = 120.0
backend_timeout = 120.0

[tool_calling]
system_suffix = "CRITICAL RULES FOR TOOL USE:\n1. You MUST use the provided tools — never respond with text descriptions of what you would do.\n2. MATCH TOOLS TO INTENT: For questions or exploration, use READ-ONLY tools (read, glob, grep, bash). Only use write/edit tools when the user explicitly asks to create or modify something.\n3. START by reading relevant files (package.json, pyproject.toml, README, etc.) to understand the project before taking any action.\n4. Never invent tool names or parameters not in the provided definitions.\n5. Never ask the user which files to look at — find them yourself.\n6. Call the SIMPLEST tool that accomplishes the task. Prefer read over bash, glob over bash."
temperature_override = 0.0
strip_thinking = false
keep_alive = "30m"
condense_tools = true
condense_system_prompt = true
max_system_tokens = 800
num_ctx = 65536
accept_text_after_tool_use = true

[escalation]
enabled = false
