# Llama 3.3 70B — dense model, solid tool caller

[model]
pattern = "llama3.3:*"
max_retries = 3
request_timeout = 900.0
backend_timeout = 300.0

[tool_calling]
system_suffix = "CRITICAL RULES FOR TOOL USE:\n1. You MUST use the provided tools — never respond with text descriptions of what you would do.\n2. MATCH TOOLS TO INTENT: For questions or exploration, use READ-ONLY tools (read, glob, grep, bash). Only use write/edit tools when the user explicitly asks to create or modify something.\n3. START by using glob with pattern='*' to list the project root, then read the project manifest you find (pyproject.toml, package.json, Cargo.toml, etc.).\n4. Never invent tool names or parameters not in the provided definitions.\n5. Never output raw JSON — always use the tool calling interface.\n6. Call the SIMPLEST tool that accomplishes the task. Prefer read over bash, glob over bash."
temperature_override = 0.0
strip_thinking = false
keep_alive = "30m"
condense_tools = true
condense_system_prompt = true
max_system_tokens = 800
accept_text_after_tool_use = true

[escalation]
enabled = false
